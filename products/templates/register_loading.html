{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>> INITIALIZING CUP.EXE...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117; /* 深蓝背调 */
            color: #ffffff; /* 白色字体 */
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        /* 复古发光窗口 */
        .loading-window {
            border: 4px solid #1a2a4a;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            padding: 60px 80px;
            text-align: center;
            position: relative;
        }

        /* 动静分离点单容器 */
        .drink-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            width: 180px;
            height: 270px; /* 稍微加高，给泡泡更充足的飘散空间 */
        }

        /* 1. 你的彩色像素杯子商标 - 贴在底部 */
        .pixel-cup {
            width: 180px;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 3; /* 确保杯子在最前面 */
            /* 🌟 核心：强制开启浏览器像素锐化，防止边缘模糊 */
            image-rendering: pixelated;
        }

        /* 2. 泡泡的基础通用样式 */
        .pixel-bubble {
            position: absolute;
            z-index: 1; /* 泡泡从杯子后面或里面升起 */
            opacity: 0;
            image-rendering: pixelated; /* 泡泡也保持锐利像素 */
        }

        /* 3. 【大泡泡逻辑】 飘得慢，摇摆幅度大 */
        .big-bubble-style {
            width: 24px; /* 根据你的图片大小调整显示宽度 */
            animation: floatBigBubble 4s infinite linear;
        }

        /* 4. 【小泡泡逻辑】 飘得快，更灵动 */
        .small-bubble-style {
            width: 14px; /* 小泡泡尺寸 */
            animation: floatSmallBubble 2.8s infinite linear;
        }

        /* ======= 🌟【4个泡泡错开排队，形成连绵不绝的效果】 ======= */
        .bubble-1 { bottom: 70px; left: 45px; animation-delay: 0s; }
        .bubble-2 { bottom: 75px; left: 85px; animation-delay: 0.8s; }
        .bubble-3 { bottom: 65px; left: 125px; animation-delay: 1.6s; }
        .bubble-4 { bottom: 70px; left: 70px; animation-delay: 2.4s; }


        /* ======= 🌟【大泡泡：飘升 + Z字形优雅摇摆】 ======= */
        @keyframes floatBigBubble {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            40% {
                transform: translateY(-70px) translateX(-15px); /* 往左摆 */
            }
            70% {
                transform: translateY(-140px) translateX(15px); /* 往右摆 */
                opacity: 0.8;
            }
            100% {
                transform: translateY(-210px) translateX(-5px);
                opacity: 0; /* 顶端神秘消失 */
            }
        }

        /* ======= 🌟【小泡泡：速度快 + 高频小碎步摇摆】 ======= */
        @keyframes floatSmallBubble {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            15% { opacity: 1; }
            30% { transform: translateY(-50px) translateX(10px); }
            60% { transform: translateY(-110px) translateX(-10px); }
            85% { opacity: 0.7; }
            100% {
                transform: translateY(-180px) translateX(5px);
                opacity: 0;
            }
        }
        /* ============================================== */

        /* 进度条样式（紫色到绿色渐变） */
        .progress-bar-container {
            width: 400px;
            height: 30px;
            border: 4px solid #00ff41;
            padding: 2px;
            margin-top: 20px;
            position: relative; /* 核心：作为切片网格的定位基准 */
        }

        .progress-bar-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* 每 20px 产生一个 2px 的深蓝切缝，完美切出 20 个格子 */
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 18px,
                #0d1117 18px,
                #0d1117 20px
            );
            z-index: 5; /* 确保黑缝挡在进度条前面 */
            pointer-events: none; /* 让鼠标可以穿透（虽然这里用不上） */
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #bc13fe, #00ff41);
            width: 0%;
            /* 🌟 核心：加上 steps(20)，让动画分成 20 步硬核跳跃，不再丝滑，而是纯正像素风！ */
            animation: loadProgress 3.5s steps(20) forwards;
            box-shadow: 0 0 10px #00ff41;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .status-text { margin-top: 15px; font-size: 12px; color: #ffffff;}
        .window-top { position: absolute; top: 10px; right: 10px; font-size: 12px; color: #555; }

    </style>
</head>
<body>

    <div class="loading-window">
        <div class="window-top">_ □ X</div>
        <h1 style="font-size: 24px; color: #ffffff; letter-spacing: 2px; text-shadow: 2px 2px #bc13fe;">CUP.EXE</h1>

        <div class="drink-container">
            <img src="{% static 'logo_cup.png' %}" class="pixel-cup" alt="CUP.EXE">

            <img src="{% static 'pixel_bigbubble.png' %}" class="pixel-bubble big-bubble-style bubble-1" alt="Bubble">
            <img src="{% static 'pixel_smallbubble.png' %}" class="pixel-bubble small-bubble-style bubble-2" alt="Bubble">
            <img src="{% static 'pixel_smallbubble.png' %}" class="pixel-bubble small-bubble-style bubble-3" alt="Bubble">
            <img src="{% static 'pixel_bigbubble.png' %}" class="pixel-bubble big-bubble-style bubble-4" alt="Bubble">
        </div>
        <div class="progress-bar-container">
            <div class="progress-fill"></div>
        </div>

        <p class="status-text">> LOADING FLAVOR... 100% READY</p>
    </div>

    <script>
        setTimeout(function() {
            window.location.replace("/");
        }, 3500);
    </script>

</body>
</html>
